<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manhwa Voice Test Page</title>
  <style>
    body {
      background: #12121e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 30px 20px 200px 20px;
      margin: 0;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      color: #9da0b5;
      font-size: 14px;
      margin: 8px 0 24px 0;
    }
    .comic-strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .panel-container {
      display: inline-block;
      background: #ffffff;
      padding: 4px;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    img {
      display: block;
      width: 800px;
      height: 1200px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Manhwa Voice — Test Fixture Page</h1>
  <p>Two comic panels below. Click "Activate on this page", then Play to test continuous narration and auto-scrolling.</p>

  <div class="comic-strip">
    <div class="panel-container">
      <img id="comic-panel-1" src="test-comic.png" alt="Comic panel 1" width="800" height="1200" />
    </div>

    <div class="panel-container">
      <img id="comic-panel-2" src="test-comic-2.png" alt="Comic panel 2" width="800" height="1200" />
    </div>
  </div>
</body>
</html>
